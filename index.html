<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHAG KISAN BHAG</title>
<style>
body{background:#1a1a2e;color:white;text-align:center;font-family:Arial;margin:0}
h1{color:#ffdf70;margin:8px}
#scoreBar{background:#ffdf70;color:#000;display:inline-block;padding:8px 15px;border-radius:20px;font-weight:bold}
#game{position:relative;width:95%;max-width:480px;height:460px;margin:10px auto;background:#4CAF50;border:3px solid #ffdf70;border-radius:15px;overflow:hidden}
#bgLabel{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:5px 12px;border-radius:20px;font-size:13px;z-index:20;white-space:nowrap}
#player{position:absolute;bottom:25px;left:50%;font-size:55px;z-index:10;transform:translateX(-50%);transition:left .15s;animation:bounce .3s infinite}
@keyframes bounce{0%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}100%{transform:translateX(-50%) translateY(0)}}
#teacher{position:absolute;bottom:2px;left:50%;font-size:44px;z-index:5;transform:translateX(-50%);transition:left .15s}
.obj{position:absolute;font-size:42px;z-index:4;transform:translateX(-50%)}
.note{position:absolute;font-size:32px;z-index:3;transform:translateX(-50%)}
#songBtn{background:#ffdf70;color:#000;font-size:16px;font-weight:bold;padding:10px 20px;border-radius:30px;margin:5px;border:0}
.controls{display:flex;gap:8px;max-width:480px;margin:0 auto;padding:0 10px}
.controls button{flex:1;padding:15px 2px;font-size:16px;border-radius:15px;border:0;font-weight:bold;color:white}
</style>
</head>
<body>
<h1>🚜 BHAG KISAN BHAG 👨‍🌾</h1>
<div id="scoreBar">Score: <span id="score">0</span> | 💵 Note: <span id="coins">0</span></div><br>
<audio id="mySong" loop><source src="farming.mp3" type="audio/mpeg"></audio>
<button id="songBtn" onclick="document.getElementById('mySong').play()">🔊 SONG CHALAO</button>
<p id="status" style="color:#ffdf70;">Game khud chal raha hai!</p>

<div id="game">
<div id="bgLabel">🌾 KHET ME BHAG RAHA HAI!</div>
<div id="teacher">👩‍🏫</div>
<div id="player">👨‍🌾</div>
</div>

<div class="controls">
<button style="background:#2196F3" onclick="moveLeft()">⬅️ LEFT</button>
<button style="background:#ff5722" onclick="doJump()">⬆️ JUMP</button>
<button style="background:#9C27B0" onclick="doRoll()">⬇️ ROLL</button>
<button style="background:#4CAF50" onclick="moveRight()">RIGHT ➡️</button>
</div>

<script>
var player = document.getElementById("player");
var teacher = document.getElementById("teacher");
var game = document.getElementById("game");
var bgLabel = document.getElementById("bgLabel");
var scoreEl = document.getElementById("score");
var coinsEl = document.getElementById("coins");
var statusEl = document.getElementById("status");

var score = 0, coins = 0, lane = 1;
var lanePos = [16, 50, 83];
var isJumping = false, isRolling = false, over = false;
var objs = [];
var frames = ["👨‍🌾","🧑‍🌾","👨‍🌾","🚜"];
var fi = 0;

function updateBg(){
  var s = Math.floor(score/200) % 3;
  if(s==0){ game.style.background="#4CAF50"; bgLabel.innerText="🌾 KHET ME BHAG RAHA HAI!"; }
  if(s==1){ game.style.background="#D2A679"; bgLabel.innerText="🏡 GAON ME BHAG RAHA HAI!"; }
  if(s==2){ game.style.background="#1a1a3e"; bgLabel.innerText="🌙 RAAT ME BHAG RAHA HAI!"; }
}
function moveLeft(){ move(-1); }
function moveRight(){ move(1); }
function move(d){
  lane = Math.max(0, Math.min(2, lane + d));
  player.style.left = lanePos[lane] + "%";
  teacher.style.left = lanePos[lane] + "%";
}
function doJump(){
  if(isJumping || isRolling) return;
  isJumping = true;
  player.style.animation = "none";
  player.innerText = "🦸‍♂️";
  var p = 25;
  var up = setInterval(function(){
    p += 18; player.style.bottom = p + "px";
    if(p >= 160){
      clearInterval(up);
      var dn = setInterval(function(){
        p -= 16; player.style.bottom = p + "px";
        if(p <= 25){ clearInterval(dn); player.style.bottom = "25px"; isJumping = false; player.style.animation = ""; player.innerText = "👨‍🌾"; }
      }, 18);
    }
  }, 18);
}
function doRoll(){
  if(isRolling || isJumping) return;
  isRolling = true;
  player.style.animation = "none";
  player.innerText = "🙇‍♂️";
  player.style.fontSize = "38px";
  setTimeout(function(){
    player.innerText = "👨‍🌾";
    player.style.fontSize = "55px";
    player.style.animation = "";
    isRolling = false;
  }, 650);
}
function spawn(){
  if(over) return;
  var isNote = Math.random() < 0.6;
  var l = Math.floor(Math.random()*3);
  var el = document.createElement("div");
  el.setAttribute("data-lane", l);
  if(isNote){ el.className = "note"; el.innerText = "💵"; el.setAttribute("data-type","note"); }
  else { el.className = "obj"; el.setAttribute("data-type","obs"); var it = ["🪑","🧹","🚧","📚","🚜","🌾"]; el.innerText = it[Math.floor(Math.random()*it.length)]; if(Math.random()<0.15){ el.innerText="🚧"; el.setAttribute("data-high","1"); } }
  el.style.left = lanePos[l] + "%";
  el.style.top = "-50px";
  game.appendChild(el);
  objs.push(el);
  var mv = setInterval(function(){
    if(over){ clearInterval(mv); return; }
    var t = parseInt(el.style.top); t += 5; el.style.top = t + "px";
    var pb = parseInt(player.style.bottom || 25);
    if(parseInt(el.getAttribute("data-lane")) === lane && t > 330 && t < 420){
      if(el.getAttribute("data-type") === "note"){ coins++; coinsEl.innerText = coins; el.remove(); objs = objs.filter(function(o){return o!==el}); clearInterval(mv); }
      else {
        if(el.getAttribute("data-high") === "1"){ if(!isRolling && pb < 60){ gameOver(); clearInterval(mv); } }
        else { if(pb < 60){ gameOver(); clearInterval(mv); } }
      }
    }
    if(t > 480){ clearInterval(mv); el.remove(); objs = objs.filter(function(o){return o!==el}); }
  }, 28);
}
function gameOver(){
  over = true;
  statusEl.innerText = "😭 Pakde gaye! Score: " + score + " | Note: " + coins + " | Page Refresh karo phir se khelne ke liye!";
  alert("Pakde Gaye! 😭\nScore: " + score + " | Note: " + coins + " 💵\nRefresh karke phir khelo!");
}

// GAME KHULTE HI CHALEGA - START DABANE KI ZAROORAT NAHI
setInterval(function(){
  if(!over){
    score++; scoreEl.innerText = score; updateBg();
    if(!isJumping && !isRolling){ fi = (fi+1)%frames.length; player.innerText = frames[fi]; }
  }
}, 80);
setInterval(spawn, 600);

// Swipe
var sx=0, sy=0;
game.addEventListener("touchstart", function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
game.addEventListener("touchend", function(e){
  var dx=e.changedTouches[0].clientX-sx; var dy=e.changedT
