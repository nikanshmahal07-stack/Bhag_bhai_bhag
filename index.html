<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bhag Bhai Bhag - Subway Wala!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1a1a2e;color:white;text-align:center;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.top{padding:8px}
.top h1{font-size:23px;color:#ffdf70}
.score-box{display:flex;justify-content:center;gap:8px;margin-top:6px}
.score-box div{background:#ffdf70;color:#000;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px}
#game{position:relative;width:100%;max-width:480px;height:460px;margin:6px auto;background:#333;border:3px solid #ffdf70;border-radius:15px;overflow:hidden;touch-action:none}
/* 3 RASTE SIDE ME - SUBWAY JAISA */
.lane{position:absolute;top:0;height:100%;width:33.33%;background:#555;border-right:2px dashed rgba(255,255,255,.4)}
#lane1{left:0;background:#5e5e5e}
#lane2{left:33.33%;background:#6a6a6a}
#lane3{left:66.66%;background:#5e5e5e;border-right:0}
#player{position:absolute;bottom:25px;left:50%;font-size:50px;z-index:10;transition:left .16s, bottom .15s;transform:translateX(-50%);filter:drop-shadow(2px 3px 0 rgba(0,0,0,.4))}
#player.roll{font-size:38px !important}
#teacher{position:absolute;bottom:2px;left:50%;font-size:44px;z-index:5;transition:left .16s;transform:translateX(-50%);opacity:.9}
.obj{position:absolute;font-size:42px;z-index:4;transform:translateX(-50%)}
.coin{position:absolute;font-size:30px;z-index:3;transform:translateX(-50%);animation:spin 0.6s infinite}
@keyframes spin{0%{transform:translateX(-50%) scaleX(1)}50%{transform:translateX(-50%) scaleX(0.3)}100%{transform:translateX(-50%) scaleX(1)}}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);padding:20px;border-radius:15px;width:88%;z-index:30;display:none}
#msg h2{color:#ffdf70;font-size:23px;margin-bottom:8px}
#msg p{font-size:15px;line-height:1.6}
button{padding:12px 18px;border:0;border-radius:30px;background:#ffd34f;font-size:16px;font-weight:bold;margin-top:8px;cursor:pointer}
.controls{display:flex;justify-content:center;gap:8px;max-width:480px;margin:0 auto;padding:0 8px}
.controls button{flex:1;padding:15px 3px;font-size:16px}
#leftBtn{background:#2196F3;color:white}
#jumpBtn{background:#ff5722;color:white}
#rollBtn{background:#9C27B0;color:white}
#rightBtn{background:#4CAF50;color:white}
#musicBtn{background:#222;color:#ffdf70;padding:7px 14px;font-size:13px;margin-top:5px;border:1px solid #ffdf70}
.small{font-size:12px;opacity:.7;margin-top:5px}
</style>
</head>
<body>
<div class="top">
<h1>🏃 BHAG BHAI BHAG 🚇</h1>
<p>Subway Surfers Style!</p>
<div class="score-box"><div>Score: <span id="score">0</span></div><div>🪙 Coin: <span id="coins">0</span></div><div>Best: <span id="best">0</span></div></div>
<button id="musicBtn" onclick="toggleMusic()">🔊 Music: ON</button>
</div>

<div id="game">
<div class="lane" id="lane1"></div>
<div class="lane" id="lane2"></div>
<div class="lane" id="lane3"></div>
<div id="teacher">👩‍🏫</div>
<div id="player">🏃</div>
<div id="msg"><h2 id="msgTitle">Ready Ho?</h2><p id="msgText"></p><button onclick="startGame()">🔁 Phir Se Bhago</button></div>
</div>

<div class="controls">
<button id="leftBtn" onclick="move(-1)">⬅️ LEFT</button>
<button id="jumpBtn" onclick="jump()">⬆️ JUMP</button>
<button id="rollBtn" onclick="roll()">⬇️ ROLL</button>
<button id="rightBtn" onclick="move(1)">RIGHT ➡️</button>
</div>
<p class="small">Swipe Left/Right = Rasta Badlo | Swipe Up = Jump | Swipe Down = Roll</p>

<script>
let player=document.getElementById("player");
let teacher=document.getElementById("teacher");
let game=document.getElementById("game");
let scoreEl=document.getElementById("score");
let coinsEl=document.getElementById("coins");
let bestEl=document.getElementById("best");
let msg=document.getElementById("msg");
let msgTitle=document.getElementById("msgTitle");
let msgText=document.getElementById("msgText");
let score=0,coins=0,best=localStorage.getItem("bhagSubwayBest")||0;
bestEl.innerText=best;
let isJumping=false,isRolling=false,gameOver=false,gameStarted=false,objs=[];
let gameInterval,spawnInterval,speed=5;
let currentLane=1; // 0 left, 1 center, 2 right
let lanePos=[16.66,50,83.33];
let musicOn=true,audioCtx=null,musicInterval=null;
let funnyLines=["Teacher ne pakad liya! Kal mummy ko lekar aana! 😂","Train se takra gaya bhai!","Roll karna tha, jump maar diya!","Coin ke chakkar me pakda gaya!","Homework nahi kiya tha na?"];

function getAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function playTone(f,d,t='sine',v=0.15){ if(!musicOn) return; try{ let c=getAudio(); let o=c.createOscillator(); let g=c.createGain(); o.frequency.value=f; o.type=t; g.gain.value=v; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d);}catch(e){} }
function playJump(){ playTone(500,0.1,'sine',0.2); setTimeout(()=>playTone(800,0.1,'sine',0.2),60); }
function playCoin(){ playTone(1000,0.08,'sine',0.2); setTimeout(()=>playTone(1400,0.1,'sine',0.2),70); }
function playOver(){ playTone(300,0.3,'sawtooth',0.15); setTimeout(()=>playTone(200,0.3,'sawtooth',0.15),200); setTimeout(()=>playTone(100,0.4,'sawtooth',0.15),400); }
function startMusic(){ if(musicInterval) return; let n=[262,294,330,392,330,294,262,294]; let i=0; musicInterval=setInterval(()=>{ if(musicOn && gameStarted && !gameOver){ playTone(n[i%n.length],0.16,'triangle',0.05); i++; } },200); }
function toggleMusic(){ musicOn=!musicOn; document.getElementById("musicBtn").innerText=musicOn?"🔊 Music: ON":"🔇 Music: OFF"; }

function move(dir){
 if(gameOver) return;
 if(!gameStarted){ startGame(); return; }
 currentLane=Math.max(0,Math.min(2,currentLane+dir));
 player.style.left=lanePos[currentLane]+"%";
 teacher.style.left=lanePos[currentLane]+"%";
 playTone(600,0.07,'sine',0.12);
}
function jump(){
 if(gameOver) return;
 if(!gameStarted){ startGame(); return; }
 if(isJumping||isRolling) return;
 isJumping=true; playJump(); player.innerText="🦸";
 let pos=25;
 let up=setInterval(()=>{
  pos+=16; player.style.bottom=pos+"px";
  if(pos>=150){ clearInterval(up);
   let down=setInterval(()=>{ pos-=16; player.style.bottom=pos+"px";
    if(pos<=25){ clearInterval(down); player.style.bottom="25px"; isJumping=false; player.innerText="🏃"; }
   },18);
  }
 },18);
}
function roll(){
 if(gameOver) return;
 if(!gameStarted){ startGame(); return; }
 if(isRolling||isJumping) return;
 isRolling=true; playTone(300,0.1,'sine',0.15); player.innerText="🙇"; player.classList.add("roll");
 setTimeout(()=>{ player.innerText="🏃"; player.classList.remove("roll"); isRolling=false; },650);
}
function spawn(){
 if(gameOver) return;
 // Kabhi obstacle, kabhi coin
 let isCoin=Math.random()<0.35;
 let lane=Math.floor(Math.random()*3);
 let el=document.createElement("div");
 el.dataset.lane=lane;
 if(isCoin){
  el.className="obj coin"; el.innerText="🪙"; el.dataset.type="coin";
 } else {
  el.className="obj"; el.dataset.type="obs";
  let items=["🪑","🧹","🚧","📚","🚂","🪣"];
  el.innerText=items[Math.floor(Math.random()*items.length)];
  // Subway me kabhi kabhi upar wala board bhi aata hai - uske neeche se roll karna hai
  if(Math.random()<0.22){ el.innerText="🚧"; el.dataset.high="1"; el.style.fontSize="52px"; }
 }
 el.style.left=lanePos[lane]+"%";
 el.style.top="-50px";
 game.appendChild(el); objs.push(el);
 let mv=setInterval(()=>{
  if(gameOver){ clearInterval(mv); return; }
  let top=parseInt(el.style.top); top+=speed; el.style.top=top+"px";
  let pBottom=parseInt(player.style.bottom||25);
  let sameLane=(parseInt(el.dataset.lane)===currentLane);
  if(sameLane && top>330 && top<420){
   if(el.dataset.type==="coin"){
    coins++; coinsEl.innerText=coins; playCoin(); el.remove(); objs=objs.filter(o=>o!==el); clearInterval(mv);
   } else {
    // High wala obstacle - Roll karne se bach jaoge
    if(el.dataset.high==="1"){
     if(!isRolling){ gameOverFunc(); clearInterval(mv); }
    } else {
     // Normal obstacle - Jump me ho to bach jaoge
     if(pBottom<60){ gameOverFunc(); clearInterval(mv); }
    }
   }
  }
  if(top>480){ clearInterval(mv); el.remove(); objs=objs.filter(o=>o!==el); }
 },28);
}
function startGame(){
 score=0; coins=0; scoreEl.innerText=0; coinsEl.innerText=0; gameOver=false; gameStarted=true; msg.style.display="none";
 currentLane=1; speed=5; player.style.left="50%"; teacher.style.left="50%"; player.style.bottom="25px"; player.innerText="🏃";
 objs.forEach(o=>o.remove()); objs=[];
 clearInterval(gameInterval); clearInterval(spawnInterval); startMusic();
 gameInterval=setInterval(()=>{
  if(!gameOver){ score++; scoreEl.innerText=score; if(score%200===0) speed+=0.5;
   if(score>best){ best=score; bestEl.innerText=best; localStorage.setItem("bhagSubwayBest",best); }
  }
 },80);
 spawnInterval=setInterval(spawn,750);
}
function gameOverFunc(){
 gameOver=true; playOver();
 clearInterval(gameInterval); clearInterval(spawnInterval);
 let line=funnyLines[Math.floor(Math.random()*funnyLines.length)];
 msgTitle.innerText="Pakde Gaye! 😭";
 msgText.innerHTML=`<b>Score: ${score} | Coin: ${coins} 🪙</b><br>${line}<br><br>Best: ${best}<br><br>Tip: Upar wala board aaye to ROLL karo, neeche wala aaye to JUMP karo!`;
 msg.style.display="block"; gameStarted=false;
}
document.addEventListener("keydown",(e)=>{
 if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); jump(); }
 if(e.code==="ArrowLeft"){ e.preventDefault(); move(-1); }
 if(e.code==="ArrowRight"){ e.preventDefault(); move(1); }
 if(e.code==="ArrowDown"){ e.preventDefault(); roll(); }
});
let sx=0,sy=0;
game.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
game.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-sx;
 let dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>Math.abs(dy)){
  if(dx<-35) move(-1); else if(dx>35) move(1);
 } else {
  if(dy<-35) jump(); else if(dy>35) roll();
 }
},{passive:true});
msgTitle.innerText="Ready Ho? 🚇";
msgText.innerHTML="Subway Surfers jaisa!<br><br>⬅️➡️ Swipe = Rasta Badlo<br>⬆️ Swipe = Jump | ⬇️ Swipe = Roll<br>🪙 Coin uthao, 🚧 se bacho!<br><br>Upar wala board aaye to ROLL, neeche wala aaye to JUMP!";
msg.style.display="block";
</script>
</body>
</html>
